<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video chunk runner</title>
<style>
  :root {
    --bg: #eef1f4; --panel: #ffffff; --ink: #14202b; --muted: #5d6b78; --line: #cfd7de;
    --accent: #0f6e8c; --accent-ink: #ffffff; --ok: #1f7a4d; --bad: #b3261e; --run: #c98a00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11181e; --panel: #1a232b; --ink: #e6ecf1; --muted: #93a1ad; --line: #2f3c47;
      --accent: #4cb6d6; --accent-ink: #08222c; --ok: #55c58d; --bad: #ff8a80; --run: #e8b43c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 32px 16px;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.lead { margin: 0 0 24px; color: var(--muted); }
  form, .status { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px; }
  label { display: block; font-weight: 600; margin-bottom: 4px; }
  .field { margin-bottom: 16px; }
  input[type=file], input[type=text] {
    width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--ink); font: inherit;
  }
  .row { display: flex; gap: 12px; }
  .row .field { flex: 1; }
  button {
    width: 100%; padding: 12px; border: 0; border-radius: 6px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .status { margin-top: 20px; }
  .status[hidden] { display: none; }
  .headline { font-weight: 600; margin: 0 0 12px; }
  .headline.ok { color: var(--ok); }
  .headline.bad { color: var(--bad); }
  .bar { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; margin-bottom: 12px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .grid { display: flex; flex-wrap: wrap; gap: 4px; }
  .grid span { width: 18px; height: 18px; border-radius: 3px; background: var(--line); }
  .grid .running { background: var(--run); }
  .grid .done { background: var(--ok); }
  .grid .failed { background: var(--bad); }
  .note { margin: 0 0 12px; color: var(--muted); font-size: .9rem; }
  .note:empty { display: none; }
  .timing { margin: 12px 0 0; font-weight: 600; }
  .timing:empty { display: none; }
  .warn { margin: 12px 0 0; padding-left: 20px; color: var(--run); font-size: .9rem; }
  .warn:empty { display: none; }
  @media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Video chunk runner</h1>
  <p class="lead">Splits your video into chunks and sends each one to n8n as its own ComfyUI job.</p>

  <form id="form">
    <div class="field"><label for="image1">Image 1</label><input id="image1" name="image1" type="file" accept="image/*" required></div>
    <div class="field"><label for="image2">Image 2</label><input id="image2" name="image2" type="file" accept="image/*" required></div>
    <div class="field"><label for="video">Video</label><input id="video" name="video" type="file" accept="video/*" required></div>
    <div class="row">
      <div class="field"><label for="width">Width (px)</label><input id="width" name="width" type="text" inputmode="numeric" pattern="[0-9]+" value="832" required></div>
      <div class="field"><label for="height">Height (px)</label><input id="height" name="height" type="text" inputmode="numeric" pattern="[0-9]+" value="480" required></div>
      <div class="field"><label for="chunk_seconds">Chunk seconds</label><input id="chunk_seconds" name="chunk_seconds" type="text" inputmode="decimal" pattern="[0-9]*\.?[0-9]+" value="5" required></div>
    </div>
    <div class="row">
      <div class="field"><label for="frames">Frames</label><input id="frames" name="frames" type="text" inputmode="numeric" pattern="[0-9]+" value="20" required></div>
      <div class="field"><label for="grow_spatial">Grow spatial</label><input id="grow_spatial" name="grow_spatial" type="text" inputmode="numeric" pattern="[0-9]+" value="36" required></div>
      <div class="field"><label for="grow_temporal">Grow temporal</label><input id="grow_temporal" name="grow_temporal" type="text" inputmode="numeric" pattern="[0-9]+" value="1" required></div>
    </div>
    <button id="submit" type="submit">Start jobs</button>
  </form>

  <section class="status" id="status" hidden aria-live="polite">
    <p class="headline" id="headline"></p>
    <p class="note" id="note"></p>
    <div class="bar"><i id="fill"></i></div>
    <div class="grid" id="grid"></div>
    <ul class="warn" id="warn"></ul>
    <p class="timing" id="timing"></p>
  </section>
</main>

<script>
const form = document.getElementById('form');
const submit = document.getElementById('submit');
const box = document.getElementById('status');
const headline = document.getElementById('headline');
const fill = document.getElementById('fill');
const grid = document.getElementById('grid');
const warn = document.getElementById('warn');
const note = document.getElementById('note');
const timing = document.getElementById('timing');

// Time the "Start jobs" button was clicked (ms since epoch). Set on every new submit.
let startedAt = null;

const clock = (ms) => new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

function duration(ms) {
  const total = Math.round(ms / 1000);
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  if (h) return `${h}h ${String(m).padStart(2, '0')}m ${String(s).padStart(2, '0')}s`;
  if (m) return `${m}m ${String(s).padStart(2, '0')}s`;
  return `${s}s`;
}

function show(text, cls = '', pct = 0, chunks = []) {
  box.hidden = false;
  headline.textContent = text;
  headline.className = 'headline ' + cls;
  fill.style.width = pct + '%';
  grid.replaceChildren(...chunks.map((s) => Object.assign(document.createElement('span'), { className: s })));
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  startedAt = Date.now();
  timing.textContent = '';
  submit.disabled = true;
  show('Uploading files…');

  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/jobs');
  xhr.upload.onprogress = (ev) => {
    if (ev.lengthComputable) show('Uploading files…', '', (ev.loaded / ev.total) * 100);
  };
  xhr.onerror = () => { show('Could not reach the server.', 'bad'); submit.disabled = false; };
  xhr.onload = () => {
    let data = {};
    try { data = JSON.parse(xhr.responseText); } catch {}
    if (xhr.status !== 202) {
      show(data.error || 'Upload failed.', 'bad');
      submit.disabled = false;
      return;
    }
    poll(data.jobId);
  };
  xhr.send(new FormData(form));
});

async function poll(id) {
  try {
    const job = await (await fetch('/api/jobs/' + id)).json();
    const pct = job.total ? (job.done / job.total) * 100 : 0;
    note.textContent = job.note || '';
    warn.replaceChildren(...(job.warnings || []).map((w) => Object.assign(document.createElement('li'), { textContent: w })));

    if (job.status === 'splitting') {
      show('Splitting video into chunks…');
    } else if (job.status === 'processing') {
      show(`${job.done} of ${job.total} chunks completed`, '', pct, job.chunks);
    } else if (job.status === 'combining') {
      show('All chunks done. Combining videos…', '', 100, job.chunks);
    } else if (job.status === 'completed') {
      show(`All ${job.total} jobs completed. Combined video: ${job.output}`, 'ok', 100, job.chunks);
      const finishedAt = Date.now();
      timing.textContent = `Started ${clock(startedAt)} · Finished ${clock(finishedAt)} · Total time ${duration(finishedAt - startedAt)}`;
      submit.disabled = false;
      return;
    } else {
      show(job.error || 'The job failed.', 'bad', pct, job.chunks);
      submit.disabled = false;
      return;
    }
  } catch {
    show('Lost connection to the server, retrying…');
  }
  setTimeout(() => poll(id), 2000);
}
</script>
</body>
</html>
